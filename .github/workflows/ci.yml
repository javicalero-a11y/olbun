name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://olbun_app:olbun_app_dev_only@localhost:5432/olbun?schema=public
  DIRECT_DATABASE_URL: postgresql://olbun:olbun@localhost:5432/olbun?schema=public
  APP_URL: http://localhost:3100
  AUTH_SECRET: ci-secret-not-used-for-anything-real-000000
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  NODE_ENV: test
  S3_ENDPOINT: http://localhost:9000
  S3_BUCKET: olbun-documentos
  S3_ACCESS_KEY: olbun
  S3_SECRET_KEY: olbun-desarrollo

jobs:
  verify:
    name: typecheck → lint → test → build → e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: olbun
          POSTGRES_PASSWORD: olbun
          POSTGRES_DB: olbun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olbun -d olbun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # Document storage (M9). Started as a step rather than a service
      # container because the MinIO image needs a command (`server /data`) and
      # service containers cannot pass one. The storage tests run against a
      # real S3 implementation rather than a mock, so CI needs one.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=olbun -e MINIO_ROOT_PASSWORD=olbun-desarrollo \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Start ClamAV
        run: |
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.5.3-debian13-slim
          for i in $(seq 1 120); do
            docker exec clamav clamdscan --ping 1 && break
            if [ "$i" = 120 ]; then docker logs clamav; exit 1; fi
            sleep 1
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit and integration tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          NODE_ENV: production

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Document storage (M9). Started as a step rather than a service
      # container because the MinIO image needs a command (`server /data`) and
      # service containers cannot pass one. The storage tests run against a
      # real S3 implementation rather than a mock, so CI needs one.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=olbun -e MINIO_ROOT_PASSWORD=olbun-desarrollo \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SPEC §7.4: dependency scanning in CI.
      - run: pnpm audit --audit-level high
