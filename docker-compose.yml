name: olbun

# Local development dependencies only. Redis (BullMQ) is still absent because
# nothing queues work yet. Integration tests spin up their own Postgres via
# Testcontainers.

services:
  postgres:
    image: postgres:16-alpine
    container_name: olbun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: olbun
      POSTGRES_PASSWORD: olbun
      POSTGRES_DB: olbun
      # Deterministic collation so ORDER BY matches across dev machines and CI.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=es-ES --encoding=UTF8'
    ports:
      # 5433 on the host to avoid colliding with a locally installed Postgres.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olbun -d olbun']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Object storage for documents (M9). S3-compatible, so the same client code
  # runs against MinIO here and against real S3 in production — the only
  # difference is the endpoint and the credentials.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: olbun-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: olbun
      MINIO_ROOT_PASSWORD: olbun-desarrollo
    ports:
      - '9000:9000'
      # Console, for looking at what actually got written during development.
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
